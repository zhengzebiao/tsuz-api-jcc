name: Migrate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment for the migration
        required: true
        type: choice
        options:
          - test
          - product
      revision:
        description: Alembic target revision, for example head or a revision id
        required: true
        default: head
        type: string
      backup_confirmed:
        description: Confirm database backup and rollback plan before product migration
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: migrate-${{ github.repository }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      REVISION: ${{ inputs.revision }}
      BACKUP_CONFIRMED: ${{ inputs.backup_confirmed }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME }}
      DOCKER_NETWORK_NAME: ${{ vars.DOCKER_NETWORK_NAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate migration inputs
        shell: bash
        run: |
          set -euo pipefail
          case "$DEPLOY_ENV" in
            test|product)
              ;;
            *)
              echo "Unsupported migration environment: $DEPLOY_ENV" >&2
              exit 1
              ;;
          esac

          if [ -z "$REVISION" ]; then
            echo "Refusing to run migration without an Alembic revision." >&2
            exit 1
          fi
          if ! [[ "$REVISION" =~ ^[A-Za-z0-9_.:-]+$ ]]; then
            echo "Refusing to run migration with unsupported revision characters." >&2
            exit 1
          fi
          if [ "$DEPLOY_ENV" = "product" ] && [ "$BACKUP_CONFIRMED" != "true" ]; then
            echo "Refusing to run product migration without backup confirmation." >&2
            exit 1
          fi
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST environment variable}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER environment variable}"
          : "${DEPLOY_PATH:?Missing DEPLOY_PATH environment variable}"
          : "${COMPOSE_PROJECT_NAME:?Missing COMPOSE_PROJECT_NAME environment variable}"
          : "${DOCKER_NETWORK_NAME:?Missing DOCKER_NETWORK_NAME environment variable}"
          if [[ ! "$COMPOSE_PROJECT_NAME" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
            echo "Invalid COMPOSE_PROJECT_NAME: $COMPOSE_PROJECT_NAME" >&2
            exit 1
          fi
          if [[ ! "$DOCKER_NETWORK_NAME" =~ ^[a-zA-Z0-9][a-zA-Z0-9_.-]*$ ]]; then
            echo "Invalid DOCKER_NETWORK_NAME: $DOCKER_NETWORK_NAME" >&2
            exit 1
          fi
          if ! [[ "${DEPLOY_PORT:-22}" =~ ^[0-9]+$ ]] || [ "${DEPLOY_PORT:-22}" -lt 1 ] || [ "${DEPLOY_PORT:-22}" -gt 65535 ]; then
            echo "DEPLOY_PORT must be between 1 and 65535." >&2
            exit 1
          fi
          if [[ ! "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9._/-]+$ ]]; then
            echo "DEPLOY_PATH may only contain path-safe characters." >&2
            exit 1
          fi
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          : "${SSH_PRIVATE_KEY:?Missing SSH_PRIVATE_KEY secret}"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          fi
      - name: Run Alembic migration
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'COMPOSE_PROJECT_NAME=%q\n' "$COMPOSE_PROJECT_NAME"
            printf 'DOCKER_NETWORK_NAME=%q\n' "$DOCKER_NETWORK_NAME"
            printf 'REVISION=%q\n' "$REVISION"
            cat <<'REMOTE_MIGRATE'
          set -euo pipefail
          command -v docker >/dev/null 2>&1 || { echo "docker is required on the deployment server." >&2; exit 1; }
          docker compose version >/dev/null
          if ! docker network inspect "$DOCKER_NETWORK_NAME" >/dev/null 2>&1; then
            echo "Required shared Docker network does not exist: $DOCKER_NETWORK_NAME" >&2
            echo "Run the tsuz-api-main and tsuz-api-jcc Init workflows first." >&2
            exit 1
          fi
          compose=(docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env -f docker-compose.deploy.yml)
          "${compose[@]}" config --quiet
          echo "Running JCC migration to revision $REVISION."
          "${compose[@]}" run --rm --no-deps -T api alembic current
          "${compose[@]}" run --rm --no-deps -T api alembic upgrade "$REVISION"
          "${compose[@]}" run --rm --no-deps -T api alembic current
          REMOTE_MIGRATE
          } | ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && bash -s"
