name: Deploy

on:
  push:
    tags:
      - "test-v*.*.*"
      - "product-v*.*.*"
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment for rollback
        required: true
        type: choice
        options:
          - test
          - product
      image_tag:
        description: Historical immutable image tag to deploy, for example product-v1.0.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  resolve-deploy:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      version: ${{ steps.resolve.outputs.version }}
      should_build: ${{ steps.resolve.outputs.should_build }}
    steps:
      - id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_ENVIRONMENT: ${{ inputs.environment }}
          REQUESTED_IMAGE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            environment="$REQUESTED_ENVIRONMENT"
            image_tag="$REQUESTED_IMAGE_TAG"
            should_build="false"
          else
            tag="$GITHUB_REF_NAME"
            should_build="true"
            case "$tag" in
              test-v*.*.*)
                environment="test"
                image_tag="$tag"
                ;;
              product-v*.*.*)
                environment="product"
                image_tag="$tag"
                ;;
              *)
                echo "Unsupported deploy tag: $tag" >&2
                exit 1
                ;;
            esac
          fi

          if [ "$image_tag" = "latest" ] || [ "${image_tag##*:}" = "latest" ]; then
            echo "Refusing to deploy a latest tag. Use an immutable test-v*.*.* or product-v*.*.* image tag." >&2
            exit 1
          fi
          if [[ ! "$image_tag" =~ ^(test|product)-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid image tag: $image_tag" >&2
            exit 1
          fi

          if [ "$environment" = "test" ] && [[ "$image_tag" == product-v* ]]; then
            echo "Refusing to deploy a product image tag to the test environment." >&2
            exit 1
          fi
          if [ "$environment" = "product" ] && [[ "$image_tag" == test-v* ]]; then
            echo "Refusing to deploy a test image tag to the product environment." >&2
            exit 1
          fi

          version="$image_tag"
          version="${version#test-v}"
          version="${version#product-v}"

          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"

  prepare-image:
    needs: resolve-deploy
    if: ${{ needs.resolve-deploy.outputs.should_build == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-deploy.outputs.environment }}
    env:
      IMAGE_TAG: ${{ needs.resolve-deploy.outputs.image_tag }}
      DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
      DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}
      DOCKER_REGISTRY_USERNAME: ${{ vars.DOCKER_REGISTRY_USERNAME }}
      DOCKER_REGISTRY_TOKEN: ${{ secrets.DOCKER_REGISTRY_TOKEN }}
      DOCKER_BUILD_PLATFORM: ${{ vars.DOCKER_BUILD_PLATFORM }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_REPO_PATH: ${{ vars.DEPLOY_REPO_PATH }}
    steps:
      - name: Resolve image name
        id: image
        shell: bash
        run: |
          set -euo pipefail
          : "${DOCKER_REGISTRY:?Missing DOCKER_REGISTRY environment variable}"
          : "${DOCKER_IMAGE_NAME:?Missing DOCKER_IMAGE_NAME environment variable}"
          registry="${DOCKER_REGISTRY%/}"
          registry="$(printf '%s' "$registry" | tr '[:upper:]' '[:lower:]')"
          image_name="${DOCKER_IMAGE_NAME%/}"
          image_name="$(printf '%s' "$image_name" | tr '[:upper:]' '[:lower:]')"
          if [ "${image_name#"$registry"/}" = "$image_name" ]; then
            echo "DOCKER_IMAGE_NAME must start with $registry/." >&2
            exit 1
          fi
          if [[ ! "$registry" =~ ^[a-z0-9.-]+(:[0-9]+)?$ ]]; then
            echo "Invalid DOCKER_REGISTRY: $registry" >&2
            exit 1
          fi
          if [[ ! "$image_name" =~ ^[a-z0-9.-]+(:[0-9]+)?/[a-z0-9._/-]+$ ]]; then
            echo "Invalid DOCKER_IMAGE_NAME: $image_name" >&2
            exit 1
          fi
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "image_name=$image_name" >> "$GITHUB_OUTPUT"
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST environment variable}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER environment variable}"
          : "${DEPLOY_PATH:?Missing DEPLOY_PATH environment variable}"
          : "${SSH_PRIVATE_KEY:?Missing SSH_PRIVATE_KEY secret}"
          if ! [[ "${DEPLOY_PORT:-22}" =~ ^[0-9]+$ ]] || [ "${DEPLOY_PORT:-22}" -lt 1 ] || [ "${DEPLOY_PORT:-22}" -gt 65535 ]; then
            echo "DEPLOY_PORT must be between 1 and 65535." >&2
            exit 1
          fi
          if [[ ! "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9._/-]+$ ]]; then
            echo "DEPLOY_PATH may only contain path-safe characters." >&2
            exit 1
          fi
          if [[ ! "${DOCKER_REGISTRY_USERNAME:-}" =~ ^[a-zA-Z0-9@._-]+$ ]]; then
            echo "Invalid DOCKER_REGISTRY_USERNAME." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          fi
      - name: Build and push image on deployment server
        env:
          IMAGE_NAME: ${{ steps.image.outputs.image_name }}
          REGISTRY: ${{ steps.image.outputs.registry }}
        shell: bash
        run: |
          set -euo pipefail
          : "${DOCKER_REGISTRY_TOKEN:?Missing DOCKER_REGISTRY_TOKEN secret}"
          username="${DOCKER_REGISTRY_USERNAME:?Missing DOCKER_REGISTRY_USERNAME environment variable}"
          repo_path="${DEPLOY_REPO_PATH:-$DEPLOY_PATH/source}"
          platform="${DOCKER_BUILD_PLATFORM:-linux/amd64}"
          repository_url="git@github.com:$GITHUB_REPOSITORY.git"

          case "$repo_path" in
            /*) ;;
            *)
              echo "DEPLOY_REPO_PATH must be an absolute path: $repo_path" >&2
              exit 1
              ;;
          esac
          if [ "$repo_path" = "/" ] || [ "$repo_path" = "$DEPLOY_PATH" ]; then
            echo "DEPLOY_REPO_PATH must be a dedicated source directory separate from DEPLOY_PATH." >&2
            exit 1
          fi
          if [[ ! "$platform" =~ ^linux/[a-z0-9_]+$ ]]; then
            echo "Invalid DOCKER_BUILD_PLATFORM: $platform" >&2
            exit 1
          fi
          if [[ ! "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9._/-]+$ ]] || [[ ! "$repo_path" =~ ^/[a-zA-Z0-9._/-]+$ ]]; then
            echo "DEPLOY_PATH and DEPLOY_REPO_PATH may only contain path-safe characters." >&2
            exit 1
          fi
          if [[ ! "$REGISTRY" =~ ^[a-z0-9.-]+(:[0-9]+)?$ ]]; then
            echo "Invalid DOCKER_REGISTRY: $REGISTRY" >&2
            exit 1
          fi
          if [[ ! "$username" =~ ^[a-zA-Z0-9@._-]+$ ]]; then
            echo "Invalid DOCKER_REGISTRY_USERNAME." >&2
            exit 1
          fi
          if [[ ! "$IMAGE_NAME" =~ ^[a-z0-9.-]+(:[0-9]+)?/[a-z0-9._/-]+$ ]]; then
            echo "Invalid DOCKER_IMAGE_NAME: $IMAGE_NAME" >&2
            exit 1
          fi
          if [[ ! "$IMAGE_TAG" =~ ^(test|product)-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid image tag: $IMAGE_TAG" >&2
            exit 1
          fi
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid GitHub commit SHA." >&2
            exit 1
          fi

          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "REPO_PATH='$repo_path' REPOSITORY_URL='$repository_url' IMAGE_NAME='$IMAGE_NAME' IMAGE_TAG='$IMAGE_TAG' EXPECTED_SHA='$GITHUB_SHA' BUILD_PLATFORM='$platform' bash -s" <<'REMOTE_BUILD'
          set -euo pipefail
          umask 077
          command -v git >/dev/null 2>&1 || { echo "git is required on the deployment server." >&2; exit 1; }
          command -v docker >/dev/null 2>&1 || { echo "docker is required on the deployment server." >&2; exit 1; }
          if ! git config --global --get-all safe.directory | grep -Fxq "$REPO_PATH"; then
            git config --global --add safe.directory "$REPO_PATH"
          fi

          if [ -e "$REPO_PATH" ] && [ ! -d "$REPO_PATH/.git" ]; then
            echo "DEPLOY_REPO_PATH exists but is not a Git repository: $REPO_PATH" >&2
            exit 1
          fi
          if [ ! -d "$REPO_PATH/.git" ]; then
            mkdir -p "$(dirname "$REPO_PATH")"
            git clone --filter=blob:none --no-checkout "$REPOSITORY_URL" "$REPO_PATH"
          fi

          cd "$REPO_PATH"
          current_remote="$(git remote get-url origin)"
          if [ "$current_remote" != "$REPOSITORY_URL" ]; then
            echo "Unexpected Git origin: $current_remote" >&2
            echo "Expected Git origin: $REPOSITORY_URL" >&2
            exit 1
          fi

          tag_ref="refs/tags/$IMAGE_TAG"
          remote_object="$(git ls-remote origin "$tag_ref" | cut -f1)"
          remote_peeled="$(git ls-remote origin "$tag_ref^{}" | cut -f1)"
          if [ "$remote_object" != "$EXPECTED_SHA" ] && [ "$remote_peeled" != "$EXPECTED_SHA" ]; then
            echo "Remote tag commit mismatch: expected $EXPECTED_SHA, resolved ${remote_peeled:-$remote_object}" >&2
            exit 1
          fi
          git fetch --force --no-tags origin "$tag_ref:$tag_ref"
          fetched_object="$(git rev-parse "$tag_ref")"
          fetched_commit="$(git rev-parse "$tag_ref^{}")"
          if [ "$fetched_object" != "$EXPECTED_SHA" ] && [ "$fetched_commit" != "$EXPECTED_SHA" ]; then
            echo "Fetched tag commit mismatch: expected $EXPECTED_SHA, fetched $fetched_commit" >&2
            exit 1
          fi
          git checkout --detach --force "$fetched_commit"
          git clean -ffdx
          current_commit="$(git rev-parse HEAD)"
          if [ "$current_commit" != "$fetched_commit" ]; then
            echo "Deployment checkout mismatch: expected $fetched_commit, checked out $current_commit" >&2
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "Deployment source worktree is not clean after checkout." >&2
            exit 1
          fi

          docker build --pull=false --platform "$BUILD_PLATFORM" \
            --label "org.opencontainers.image.revision=$fetched_commit" \
            --label "org.opencontainers.image.version=$IMAGE_TAG" \
            -t "$IMAGE_NAME:$IMAGE_TAG" .
          docker image inspect "$IMAGE_NAME:$IMAGE_TAG" >/dev/null
          REMOTE_BUILD

          printf '%s' "$DOCKER_REGISTRY_TOKEN" | ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login '$REGISTRY' -u '$username' --password-stdin"
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker push '$IMAGE_NAME:$IMAGE_TAG' && docker image inspect '$IMAGE_NAME:$IMAGE_TAG' --format='Built image {{.Id}}; digests={{.RepoDigests}}'"

  deploy:
    needs:
      - resolve-deploy
      - prepare-image
    if: ${{ always() && needs.resolve-deploy.result == 'success' && (needs.prepare-image.result == 'success' || needs.prepare-image.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-deploy.outputs.environment }}
    env:
      IMAGE_TAG: ${{ needs.resolve-deploy.outputs.image_tag }}
      SHOULD_BUILD: ${{ needs.resolve-deploy.outputs.should_build }}
      DEPLOY_ENV: ${{ needs.resolve-deploy.outputs.environment }}
      COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME }}
      DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
      DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}
      DOCKER_REGISTRY_USERNAME: ${{ vars.DOCKER_REGISTRY_USERNAME }}
      DOCKER_REGISTRY_TOKEN: ${{ secrets.DOCKER_REGISTRY_TOKEN }}
      DOCKER_BUILD_PLATFORM: ${{ vars.DOCKER_BUILD_PLATFORM }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_REPO_PATH: ${{ vars.DEPLOY_REPO_PATH }}
      CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}
      NGINX_CONTAINER_NAME: ${{ vars.NGINX_CONTAINER_NAME }}
      APP_PORT: ${{ vars.APP_PORT }}
      NGINX_PORT: ${{ vars.NGINX_PORT }}
      APP_ENV: ${{ vars.APP_ENV }}
      DOCKER_NETWORK_NAME: ${{ vars.DOCKER_NETWORK_NAME }}
      SERVICE_NAME: ${{ vars.SERVICE_NAME }}
      DEBUG: ${{ vars.DEBUG }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL }}
      LOG_FORMAT: ${{ vars.LOG_FORMAT }}
      REQUEST_ID_HEADER: ${{ vars.REQUEST_ID_HEADER }}
      WEB_CONCURRENCY: ${{ vars.WEB_CONCURRENCY }}
      GUNICORN_TIMEOUT: ${{ vars.GUNICORN_TIMEOUT }}
      GUNICORN_GRACEFUL_TIMEOUT: ${{ vars.GUNICORN_GRACEFUL_TIMEOUT }}
      API_PREFIX: ${{ vars.API_PREFIX }}
      DB_SSLMODE: ${{ vars.DB_SSLMODE }}
      REDIS_KEY_PREFIX: ${{ vars.REDIS_KEY_PREFIX }}
      JWT_ALGORITHM: ${{ vars.JWT_ALGORITHM }}
      JWT_ISSUER: ${{ vars.JWT_ISSUER }}
      JWT_AUDIENCE: ${{ vars.JWT_AUDIENCE }}
      SERVICE_TOKEN_ISSUER: ${{ vars.SERVICE_TOKEN_ISSUER }}
      SERVICE_TOKEN_AUDIENCE: ${{ vars.SERVICE_TOKEN_AUDIENCE }}
      SERVICE_TOKEN_CLOCK_SKEW_SECONDS: ${{ vars.SERVICE_TOKEN_CLOCK_SKEW_SECONDS }}
      JCC_APP_ID: ${{ vars.JCC_APP_ID }}
      MAIN_APP_ID: ${{ vars.MAIN_APP_ID }}
      MAIN_TOKEN_URL: ${{ vars.MAIN_TOKEN_URL }}
      MAIN_API_BASE_URL: ${{ vars.MAIN_API_BASE_URL }}
      INTERNAL_HTTP_TIMEOUT_SECONDS: ${{ vars.INTERNAL_HTTP_TIMEOUT_SECONDS }}
      JCC_DATA_RAW_DIR: ${{ vars.JCC_DATA_RAW_DIR }}
      JCC_DATA_MODE: ${{ vars.JCC_DATA_MODE }}
      JCC_DATA_MODE_NAME: ${{ vars.JCC_DATA_MODE_NAME }}
      JCC_DATA_SYNC_TIMEOUT_SECONDS: ${{ vars.JCC_DATA_SYNC_TIMEOUT_SECONDS }}
      JCC_DATA_SYNC_RETRIES: ${{ vars.JCC_DATA_SYNC_RETRIES }}
      TOKEN_BLACKLIST_PREFIX: ${{ vars.TOKEN_BLACKLIST_PREFIX }}
      SESSION_PREFIX: ${{ vars.SESSION_PREFIX }}
      CORS_ALLOW_ORIGINS: ${{ vars.CORS_ALLOW_ORIGINS }}
      CORS_ALLOW_CREDENTIALS: ${{ vars.CORS_ALLOW_CREDENTIALS }}
      OPENAPI_ENABLED: ${{ vars.OPENAPI_ENABLED }}
      DOCS_ENABLED: ${{ vars.DOCS_ENABLED }}
      REDOC_ENABLED: ${{ vars.REDOC_ENABLED }}
      DEPLOY_HEALTH_RETRIES: ${{ vars.DEPLOY_HEALTH_RETRIES }}
      DEPLOY_HEALTH_INTERVAL_SECONDS: ${{ vars.DEPLOY_HEALTH_INTERVAL_SECONDS }}
      DEPLOY_PUBLIC_HEALTH_URL: ${{ vars.DEPLOY_PUBLIC_HEALTH_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      MAIN_REDIS_URL: ${{ secrets.MAIN_REDIS_URL }}
      JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
      SERVICE_TOKEN_PUBLIC_KEY: ${{ secrets.SERVICE_TOKEN_PUBLIC_KEY }}
      JCC_APP_SECRET: ${{ secrets.JCC_APP_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-deploy.outputs.image_tag }}
      - name: Resolve image name
        id: image
        shell: bash
        run: |
          set -euo pipefail
          : "${DOCKER_REGISTRY:?Missing DOCKER_REGISTRY environment variable}"
          : "${DOCKER_IMAGE_NAME:?Missing DOCKER_IMAGE_NAME environment variable}"
          registry="${DOCKER_REGISTRY%/}"
          registry="$(printf '%s' "$registry" | tr '[:upper:]' '[:lower:]')"
          image_name="${DOCKER_IMAGE_NAME%/}"
          image_name="$(printf '%s' "$image_name" | tr '[:upper:]' '[:lower:]')"
          if [ "${image_name#"$registry"/}" = "$image_name" ]; then
            echo "DOCKER_IMAGE_NAME must start with $registry/." >&2
            exit 1
          fi
          if [[ ! "$registry" =~ ^[a-z0-9.-]+(:[0-9]+)?$ ]]; then
            echo "Invalid DOCKER_REGISTRY: $registry" >&2
            exit 1
          fi
          if [[ ! "$image_name" =~ ^[a-z0-9.-]+(:[0-9]+)?/[a-z0-9._/-]+$ ]]; then
            echo "Invalid DOCKER_IMAGE_NAME: $image_name" >&2
            exit 1
          fi
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "image_name=$image_name" >> "$GITHUB_OUTPUT"
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST environment variable}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER environment variable}"
          : "${DEPLOY_PATH:?Missing DEPLOY_PATH environment variable}"
          : "${COMPOSE_PROJECT_NAME:?Missing COMPOSE_PROJECT_NAME environment variable}"
          : "${DOCKER_NETWORK_NAME:?Missing DOCKER_NETWORK_NAME environment variable}"
          : "${SSH_PRIVATE_KEY:?Missing SSH_PRIVATE_KEY secret}"
          if [[ ! "$COMPOSE_PROJECT_NAME" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
            echo "Invalid COMPOSE_PROJECT_NAME: $COMPOSE_PROJECT_NAME" >&2
            exit 1
          fi
          if [[ ! "$DOCKER_NETWORK_NAME" =~ ^[a-zA-Z0-9][a-zA-Z0-9_.-]*$ ]]; then
            echo "Invalid DOCKER_NETWORK_NAME: $DOCKER_NETWORK_NAME" >&2
            exit 1
          fi
          if ! [[ "${DEPLOY_PORT:-22}" =~ ^[0-9]+$ ]] || [ "${DEPLOY_PORT:-22}" -lt 1 ] || [ "${DEPLOY_PORT:-22}" -gt 65535 ]; then
            echo "DEPLOY_PORT must be between 1 and 65535." >&2
            exit 1
          fi
          if [[ ! "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9._/-]+$ ]]; then
            echo "DEPLOY_PATH may only contain path-safe characters." >&2
            exit 1
          fi
          if [[ ! "${DOCKER_REGISTRY_USERNAME:-}" =~ ^[a-zA-Z0-9@._-]+$ ]]; then
            echo "Invalid DOCKER_REGISTRY_USERNAME." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          fi
      - name: Upload deployment configuration
        env:
          IMAGE_NAME: ${{ steps.image.outputs.image_name }}
        shell: bash
        run: |
          set -euo pipefail
          : "${DATABASE_URL:?Missing DATABASE_URL secret}"
          : "${REDIS_URL:?Missing REDIS_URL secret}"
          : "${MAIN_REDIS_URL:?Missing MAIN_REDIS_URL secret}"
          : "${JWT_PUBLIC_KEY:?Missing JWT_PUBLIC_KEY secret}"
          : "${SERVICE_TOKEN_PUBLIC_KEY:?Missing SERVICE_TOKEN_PUBLIC_KEY secret}"
          : "${JCC_APP_ID:?Missing JCC_APP_ID environment variable}"
          : "${JCC_APP_SECRET:?Missing JCC_APP_SECRET secret}"
          : "${MAIN_APP_ID:?Missing MAIN_APP_ID environment variable}"
          umask 077
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          values = {
              "DOCKER_IMAGE_NAME": os.environ["IMAGE_NAME"],
              "APP_VERSION": os.environ["IMAGE_TAG"],
              "COMPOSE_PROJECT_NAME": os.environ.get("COMPOSE_PROJECT_NAME") or f"tsuz-api-jcc-{os.environ['DEPLOY_ENV']}",
              "CONTAINER_NAME": os.environ.get("CONTAINER_NAME") or "jcc-api",
              "NGINX_CONTAINER_NAME": os.environ.get("NGINX_CONTAINER_NAME") or "jcc-api-nginx",
              "APP_PORT": os.environ.get("APP_PORT") or "8001",
              "NGINX_PORT": os.environ.get("NGINX_PORT") or "8081",
              "APP_ENV": os.environ.get("APP_ENV") or os.environ["DEPLOY_ENV"],
              "DOCKER_NETWORK_NAME": os.environ.get("DOCKER_NETWORK_NAME") or f"tsuz-api-main-{os.environ['DEPLOY_ENV']}",
              "DEBUG": os.environ.get("DEBUG") or "false",
              "LOG_LEVEL": os.environ.get("LOG_LEVEL") or "info",
              "LOG_FORMAT": os.environ.get("LOG_FORMAT") or "json",
              "REQUEST_ID_HEADER": os.environ.get("REQUEST_ID_HEADER") or "X-Request-ID",
              "WEB_CONCURRENCY": os.environ.get("WEB_CONCURRENCY") or "4",
              "GUNICORN_TIMEOUT": os.environ.get("GUNICORN_TIMEOUT") or "60",
              "GUNICORN_GRACEFUL_TIMEOUT": os.environ.get("GUNICORN_GRACEFUL_TIMEOUT") or "30",
              "SERVICE_NAME": os.environ.get("SERVICE_NAME") or "tsuz-api-jcc",
              "API_PREFIX": os.environ.get("API_PREFIX") or "/api",
              "DATABASE_URL": os.environ["DATABASE_URL"],
              "DB_SSLMODE": os.environ.get("DB_SSLMODE") or "disable",
              "REDIS_URL": os.environ["REDIS_URL"],
              "MAIN_REDIS_URL": os.environ["MAIN_REDIS_URL"],
              "REDIS_KEY_PREFIX": os.environ.get("REDIS_KEY_PREFIX") or f"tsuz:jcc:{os.environ['DEPLOY_ENV']}:cache:",
              "JWT_ALGORITHM": os.environ.get("JWT_ALGORITHM") or "RS256",
              "JWT_ISSUER": os.environ.get("JWT_ISSUER") or "tsuz-api-main",
              "JWT_AUDIENCE": os.environ.get("JWT_AUDIENCE") or "tsuz-api-main",
              "JWT_PUBLIC_KEY": os.environ["JWT_PUBLIC_KEY"],
              "SERVICE_TOKEN_ISSUER": os.environ.get("SERVICE_TOKEN_ISSUER") or "tsuz-api-main",
              "SERVICE_TOKEN_AUDIENCE": os.environ.get("SERVICE_TOKEN_AUDIENCE") or os.environ["JCC_APP_ID"],
              "SERVICE_TOKEN_CLOCK_SKEW_SECONDS": os.environ.get("SERVICE_TOKEN_CLOCK_SKEW_SECONDS") or "5",
              "SERVICE_TOKEN_PUBLIC_KEY": os.environ["SERVICE_TOKEN_PUBLIC_KEY"],
              "JCC_APP_ID": os.environ["JCC_APP_ID"],
              "JCC_APP_SECRET": os.environ["JCC_APP_SECRET"],
              "MAIN_APP_ID": os.environ["MAIN_APP_ID"],
              "MAIN_TOKEN_URL": os.environ.get("MAIN_TOKEN_URL") or f"http://tsuz-api-main-{os.environ['DEPLOY_ENV']}:8000/internal/oauth/token",
              "MAIN_API_BASE_URL": os.environ.get("MAIN_API_BASE_URL") or f"http://tsuz-api-main-{os.environ['DEPLOY_ENV']}:8000",
              "INTERNAL_HTTP_TIMEOUT_SECONDS": os.environ.get("INTERNAL_HTTP_TIMEOUT_SECONDS") or "10",
              "JCC_DATA_RAW_DIR": os.environ.get("JCC_DATA_RAW_DIR") or "raw",
              "JCC_DATA_MODE": os.environ.get("JCC_DATA_MODE") or "18",
              "JCC_DATA_MODE_NAME": os.environ.get("JCC_DATA_MODE_NAME") or "自然之力",
              "JCC_DATA_SYNC_TIMEOUT_SECONDS": os.environ.get("JCC_DATA_SYNC_TIMEOUT_SECONDS") or "30",
              "JCC_DATA_SYNC_RETRIES": os.environ.get("JCC_DATA_SYNC_RETRIES") or "2",
              "TOKEN_BLACKLIST_PREFIX": os.environ.get("TOKEN_BLACKLIST_PREFIX") or f"auth:{os.environ['DEPLOY_ENV']}:blacklist:jti:",
              "SESSION_PREFIX": os.environ.get("SESSION_PREFIX") or f"auth:{os.environ['DEPLOY_ENV']}:session:",
              "CORS_ALLOW_ORIGINS": os.environ.get("CORS_ALLOW_ORIGINS") or "https://app.example.com",
              "CORS_ALLOW_CREDENTIALS": os.environ.get("CORS_ALLOW_CREDENTIALS") or "true",
              "OPENAPI_ENABLED": os.environ.get("OPENAPI_ENABLED") or "false",
              "DOCS_ENABLED": os.environ.get("DOCS_ENABLED") or "false",
              "REDOC_ENABLED": os.environ.get("REDOC_ENABLED") or "false",
          }

          lines = []
          for key, value in values.items():
              if any(character in value for character in "\x00"):
                  raise SystemExit(f"{key} contains a NUL byte")
              lines.append(f"{key}={json.dumps(value.replace('$', '$$'), ensure_ascii=False)}")
          Path(".env.deploy.generated").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          trap 'rm -f .env.deploy.generated' EXIT
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH/nginx' && chmod 700 '$DEPLOY_PATH'"
          scp -i ~/.ssh/deploy_key -P "${DEPLOY_PORT:-22}" docker-compose.deploy.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.deploy.yml"
          scp -i ~/.ssh/deploy_key -P "${DEPLOY_PORT:-22}" nginx/default.conf "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/nginx/default.conf"
          scp -i ~/.ssh/deploy_key -P "${DEPLOY_PORT:-22}" .env.deploy.generated "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.env.next"
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod 600 '$DEPLOY_PATH/.env.next' && mv -f '$DEPLOY_PATH/.env.next' '$DEPLOY_PATH/.env'"
      - name: Verify shared Docker network
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker network inspect '$DOCKER_NETWORK_NAME' >/dev/null 2>&1 || { echo 'Required shared Docker network does not exist: $DOCKER_NETWORK_NAME' >&2; exit 1; }"
      - name: Run normal release database bootstrap
        if: ${{ env.SHOULD_BUILD == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'COMPOSE_PROJECT_NAME=%q\n' "$COMPOSE_PROJECT_NAME"
            cat <<'REMOTE_BOOTSTRAP'
          set -euo pipefail
          compose=(docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env -f docker-compose.deploy.yml)
          compose_run() {
            "${compose[@]}" run --rm --no-deps -T "$@" </dev/null
          }

          echo "Running JCC Alembic upgrade head."
          compose_run api alembic upgrade head
          echo "Running idempotent JCC seed."
          compose_run api python -m app.seed
          echo "Reporting JCC permission catalog to tsuz-api-main."
          compose_run api python -m scripts.report_permissions
          echo "JCC database bootstrap completed."
          REMOTE_BOOTSTRAP
          } | ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && bash -s"
      - name: Deploy with docker compose
        env:
          IMAGE_NAME: ${{ steps.image.outputs.image_name }}
          REGISTRY: ${{ steps.image.outputs.registry }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$SHOULD_BUILD" = "true" ]; then
            ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
              "docker image inspect '$IMAGE_NAME:$IMAGE_TAG' >/dev/null && cd '$DEPLOY_PATH' && docker compose -p '$COMPOSE_PROJECT_NAME' --env-file .env -f docker-compose.deploy.yml up -d --no-build api nginx"
          else
            : "${DOCKER_REGISTRY_TOKEN:?Missing DOCKER_REGISTRY_TOKEN secret for rollback}"
            username="${DOCKER_REGISTRY_USERNAME:?Missing DOCKER_REGISTRY_USERNAME environment variable}"
            printf '%s' "$DOCKER_REGISTRY_TOKEN" | ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
              "docker login '$REGISTRY' -u '$username' --password-stdin"
            ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
              "cd '$DEPLOY_PATH' && docker compose -p '$COMPOSE_PROJECT_NAME' --env-file .env -f docker-compose.deploy.yml pull api && docker compose -p '$COMPOSE_PROJECT_NAME' --env-file .env -f docker-compose.deploy.yml up -d --no-build api nginx"
          fi
      - name: Wait for API container health
        shell: bash
        run: |
          set -euo pipefail
          retries="${DEPLOY_HEALTH_RETRIES:-30}"
          interval="${DEPLOY_HEALTH_INTERVAL_SECONDS:-5}"
          if ! [[ "$retries" =~ ^[1-9][0-9]*$ ]]; then
            echo "DEPLOY_HEALTH_RETRIES must be a positive integer." >&2
            exit 1
          fi
          if ! [[ "$interval" =~ ^[1-9][0-9]*$ ]]; then
            echo "DEPLOY_HEALTH_INTERVAL_SECONDS must be a positive integer." >&2
            exit 1
          fi
          {
            printf 'COMPOSE_PROJECT_NAME=%q\n' "$COMPOSE_PROJECT_NAME"
            printf 'DEPLOY_HEALTH_RETRIES=%q\n' "$retries"
            printf 'DEPLOY_HEALTH_INTERVAL_SECONDS=%q\n' "$interval"
            cat <<'REMOTE_HEALTH'
          set -euo pipefail
          compose=(docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env -f docker-compose.deploy.yml)
          container_id="$("${compose[@]}" ps -q api)"
          if [ -z "$container_id" ]; then
            echo "Unable to resolve api container id." >&2
            "${compose[@]}" ps
            exit 1
          fi
          for attempt in $(seq 1 "$DEPLOY_HEALTH_RETRIES"); do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id")"
            if [ "$status" = "healthy" ] || [ "$status" = "running" ]; then
              echo "api container health is $status."
              exit 0
            fi
            echo "Waiting for api container health ($attempt/$DEPLOY_HEALTH_RETRIES): $status"
            sleep "$DEPLOY_HEALTH_INTERVAL_SECONDS"
          done
          echo "api container did not become healthy." >&2
          "${compose[@]}" ps
          "${compose[@]}" logs --tail=100 api nginx
          exit 1
          REMOTE_HEALTH
          } | ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && bash -s"
      - name: Run deployment smoke test
        shell: bash
        run: |
          set -euo pipefail
          request_id="deploy-$GITHUB_RUN_ID-$IMAGE_TAG"
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && docker compose -p '$COMPOSE_PROJECT_NAME' --env-file .env -f docker-compose.deploy.yml exec -T -e DEPLOY_SMOKE_REQUEST_ID='$request_id' api python -" <<'PY'
          import os
          import urllib.error
          import urllib.request

          REQUEST_ID = os.environ["DEPLOY_SMOKE_REQUEST_ID"]

          def assert_status(request, expected_status, label):
              try:
                  with urllib.request.urlopen(request, timeout=10) as response:
                      status = response.status
                      request_id = response.headers.get("X-Request-ID")
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  request_id = exc.headers.get("X-Request-ID")
              if status != expected_status:
                  raise SystemExit(f"{label} expected {expected_status}, got {status}")
              if request_id != REQUEST_ID:
                  raise SystemExit(f"{label} expected X-Request-ID {REQUEST_ID}, got {request_id}")

          health_request = urllib.request.Request(
              "http://127.0.0.1:8000/health",
              headers={"X-Request-ID": REQUEST_ID},
          )
          assert_status(health_request, 200, "health")
          profile_request = urllib.request.Request(
              "http://127.0.0.1:8000/api/profile",
              headers={"X-Request-ID": REQUEST_ID},
          )
          assert_status(profile_request, 401, "unauthenticated profile")
          print("Deployment smoke test passed.")
          PY
      - name: Optional public health check
        if: ${{ env.DEPLOY_PUBLIC_HEALTH_URL != '' }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --retry 5 --retry-delay 5 --retry-connrefused -H "X-Request-ID: deploy-$GITHUB_RUN_ID" "$DEPLOY_PUBLIC_HEALTH_URL"
