services:
  api:
    image: ${DOCKER_IMAGE_NAME}:${APP_VERSION}
    container_name: ${CONTAINER_NAME:-jcc-api}
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8001}:8000"
    networks:
      backend:
        aliases:
          - jcc-api
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    container_name: ${NGINX_CONTAINER_NAME:-jcc-api-nginx}
    ports:
      - "${NGINX_PORT:-8081}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    external: true
    name: ${DOCKER_NETWORK_NAME:-tsuz-api-main-test}
